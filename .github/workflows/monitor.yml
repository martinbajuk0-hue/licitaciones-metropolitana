name: Monitor Licitaciones ARCE

on:
  schedule:
    # Corre 3 veces por día: 7am, 12pm y 6pm hora Uruguay (UTC-3)
    - cron: '0 10,15,21 * * *'
  workflow_dispatch:  # También permite correrlo manualmente
    inputs:
      test_email:
        description: 'Mandar solo un email de prueba (no corre el monitoreo real)'
        type: boolean
        default: false
      auditoria:
        description: 'Auditoría de solo lectura: muestra término+fragmento de cada match, sin marcar como visto ni enviar email'
        type: boolean
        default: false
      rango_fechas:
        description: 'Email de prueba con licitaciones REALES publicadas en este rango (formato YYYY-MM-DD:YYYY-MM-DD, ej. 2026-08-13:2026-08-14). Solo lectura, no marca como visto ni toca el catálogo del visor. Dejar vacío para no usar este modo.'
        type: string
        default: ''
      sin_email:
        description: 'Corrida real (marca como visto, actualiza el catálogo del visor) pero SIN mandar email — útil para absorber backlog manualmente sin generar una alerta grande. Se ignora si test_email/auditoria/rango_fechas están activos.'
        type: boolean
        default: false

# Evita que dos corridas se pisen: sin esto, una corrida lenta (el feed
# mensual puede traer varios cientos de llamados nuevos — cada uno implica
# 1-2 requests HTTP con timeout, así que una corrida puede tardar más de
# una hora) que sigue en curso cuando toca el próximo disparador (cron
# cada ~5hs, o un run manual) hace que la segunda corrida arranque
# restaurando el MISMO caché viejo de licitaciones vistas que la primera
# — las dos terminan reprocesando el mismo backlog y mandando cada una su
# propio email con cientos de tarjetas (evidencia real 2026-08-18/19:
# corridas #199, #200 y #201, cada una ~1h50m, cada una repitiendo el
# mismo trabajo). "cancel-in-progress: false" hace que la corrida nueva
# espere en cola a que termine la anterior, en vez de competir por el
# mismo caché o cancelarla a mitad de camino perdiendo su progreso.
concurrency:
  group: monitor-licitaciones-arce
  cancel-in-progress: false

permissions:
  contents: write  # necesario para el commit+push de docs/data y docs/informes (visor web)

jobs:
  monitorear:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar historial de licitaciones vistas
        uses: actions/cache@v4
        with:
          path: data/licitaciones_vistas.json
          key: licitaciones-vistas-${{ runner.os }}
          restore-keys: licitaciones-vistas-

      - name: Ejecutar monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          # Opcional: si se configura este secret, el resumen ejecutivo se genera vía Claude
          # en vez del resumen extractivo por reglas (ver docs/ARQUITECTURA.md).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python monitor.py
          ${{ inputs.test_email && '--test-email'
              || (inputs.auditoria && '--auditoria'
              || (inputs.rango_fechas && format('--test-rango-fechas {0}', inputs.rango_fechas)
              || (inputs.sin_email && '--sin-email'
              || ''))) }}

      - name: Guardar historial actualizado
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/licitaciones_vistas.json
          key: licitaciones-vistas-${{ runner.os }}-${{ github.run_id }}

      - name: Publicar catálogo del visor web (docs/data, docs/informes)
        if: always() && !inputs.test_email && !inputs.auditoria && !inputs.rango_fechas
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add docs/data docs/informes
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo del visor, no hay nada que commitear."
          else
            git commit -m "Actualizar catálogo del visor [skip ci]"
            git push
          fi
