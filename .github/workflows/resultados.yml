name: Resultados de Adjudicación

on:
  schedule:
    # Una vez por día, 8am hora Uruguay (UTC-3) — antes de la primera
    # corrida del día de monitor.yml (7am/12pm/6pm Uruguay, ver ese
    # archivo) para minimizar la chance de que los dos workflows hagan
    # commit+push a docs/data al mismo tiempo. Los resultados de
    # adjudicación no cambian con la frecuencia de monitor.yml — ARCE
    # tarda semanas o meses en resolver una compra — así que no hace
    # falta correr esto más seguido.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      sin_email:
        description: 'Actualiza el catálogo del visor con los resultados nuevos pero SIN mandar email.'
        type: boolean
        default: false

# Mismo motivo que en monitor.yml: evita que dos corridas de ESTE
# workflow se pisen entre sí si se dispara manualmente mientras la
# programada sigue en curso.
concurrency:
  group: resultados-adjudicacion-arce
  cancel-in-progress: false

permissions:
  contents: write  # necesario para el commit+push de docs/data/llamados.json

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar resultados de adjudicación
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: >
          python revisar_resultados.py
          ${{ inputs.sin_email && '--sin-email' || '' }}

      - name: Publicar catálogo del visor web actualizado
        if: always()
        run: |
          git config user.name "resultados-bot"
          git config user.email "resultados-bot@users.noreply.github.com"
          git add docs/data/llamados.json
          if git diff --cached --quiet; then
            echo "Sin cambios en resultados de adjudicación, no hay nada que commitear."
            exit 0
          fi
          git commit -m "Actualizar resultados de adjudicación [skip ci]"

          # monitor.yml también pushea a docs/data mientras corre (puede
          # tardar 2+ horas) — si el remoto avanzó, "git push" es rechazado.
          # monitor.py solo AGREGA llamados nuevos y este script solo
          # actualiza el campo "resultado" de llamados YA existentes, así
          # que son ediciones a distintas líneas del mismo JSON: un rebase
          # automático las combina sin conflicto en el caso normal. Si
          # hubiera un conflicto real, el rebase falla y abortamos con
          # error en vez de forzar nada (evidencia real de esta clase de
          # choque, del lado de monitor.yml: corridas #202, #203, #205).
          intentos_restantes=5
          while [ "$intentos_restantes" -gt 0 ]; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            intentos_restantes=$((intentos_restantes - 1))
            echo "Push rechazado (quedan $intentos_restantes reintentos) — el remoto avanzó mientras corríamos. Reintentando con rebase..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Conflicto real al rebasar sobre origin/main — no se puede resolver automáticamente. Se pierde esta actualización, pero se vuelve a calcular en la próxima corrida."
              git rebase --abort
              exit 1
            fi
            sleep $((5 + RANDOM % 10))
          done
          echo "::error::No se pudo pushear después de varios reintentos."
          exit 1
