# Base de organismos públicos uruguayos a priorizar en el monitoreo.
# Regla del rol: "Buscar especialmente organismos como Intendencias,
# Ministerios, UTE, OSE, ANEP, CODICEN, ASSE, hospitales, universidades,
# empresas públicas y municipios."
#
# Esta lista se usa para (a) marcar como prioritarias las licitaciones de
# estos organismos en report.py/risk.py, y (b) referencia rápida al
# investigar antecedentes (paso 12 del flujo).

