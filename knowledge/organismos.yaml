municipios:
  # Los municipios (gobiernos de cercanía) dependen de cada Intendencia.
  # PENDIENTE: completar con el listado específico de municipios cuando
  # se detecte una licitación municipal relevante — no se listan los ~125
  # municipios acá para evitar mantenimiento innecesario; se identifican
  # por texto libre ("Municipio de <nombre>") en monitor.py.
  nota: "Detectar por patrón 'Municipio de <nombre>' en el texto de la licitación."

fuentes_de_publicacion:
