# Sinónimos y expansión de términos.
# Se usa para (a) ampliar búsquedas más allá de knowledge/keywords.yaml y
# (b) traducir siglas de organismos/documentación a su nombre completo en
# los informes generados por report.py.
#
# Si un término del pliego no aparece acá y creés que debería, agregalo:
# es la forma más rápida de mejorar la detección sin tocar código.

productos:
  piso vinílico: ["vinyl flooring", "PVC flooring", "LVT", "luxury vinyl tile", "piso vinilico", "piso PVC"]
  piso SPC: ["stone plastic composite", "piso rígido", "rigid core flooring"]
  piso laminado: ["laminate flooring", "piso flotante", "piso melamínico"]
  piso de madera: ["hardwood flooring", "piso ingenieril", "piso de ingeniería", "parquet"]
  césped sintético: ["synthetic turf", "artificial turf", "pasto sintético", "césped artificial", "gramilla sintética"]
  piso de goma: ["rubber flooring", "piso de caucho", "piso elastomérico"]
  deck WPC: ["wood plastic composite", "wpc decking", "deck compuesto", "deck sintético"]
  panel ranurado: ["slat panel", "wood wall", "solid wall", "panel listonado", "panel ripado"]
  jardín vertical: ["green wall", "vertical garden", "muro verde"]
  moquette: ["carpet tile", "moqueta", "alfombra en rollo"]

