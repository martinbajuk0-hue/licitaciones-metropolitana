equivalencias_recomendadas:
  # Ejemplos de cómo pricing.py/analyzer.py sugieren un producto Metropolitana
  # cuando el pliego pide una especificación genérica.
  - especificacion_pliego: "piso vinílico homogéneo alto tránsito para uso hospitalario"
    productos_sugeridos: ["piso_vinilico_rollo"]
    nota: "PENDIENTE: confirmar referencia comercial exacta y certificación bacteriostática con el equipo técnico."
  - especificacion_pliego: "césped sintético para cancha de fútbol 7"
    productos_sugeridos: ["cesped_deportivo_futbol"]
    nota: "PENDIENTE: confirmar altura de fibra y densidad según el pliego puntual."
