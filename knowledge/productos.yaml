# Catálogo de productos y servicios de Metropolitana Pisos.
# Esta es la fuente de verdad que usan analyzer.py (para identificar
# productos dentro de un pliego) y pricing.py (para armar cotizaciones).
#
# IMPORTANTE — DATOS PENDIENTES:
# Los campos marcados como PENDIENTE no vienen definidos en los PDFs de
# origen (Prompt Claude Code Licitaciones Metropolitana Parte 1 y 2).
# Según la regla "nunca inventes información. Si falta un dato, indicá
# exactamente qué falta y dónde obtenerlo": estos campos deben completarse
# con las fichas técnicas y catálogo comercial real de Metropolitana Pisos
# (marca/proveedor, espesores, capa de desgaste, certificaciones, precio
# de lista). Hasta entonces, pricing.py y report.py marcan cualquier
# cálculo que dependa de ellos como "estimado / requiere verificación".

categorias:
  pisos:
    subtipos:
      - id: piso_spc
        nombre: "Piso SPC (Stone Plastic Composite)"
        usos_tipicos: ["comercial", "hospitalario", "oficinas", "alto tránsito"]
        espesor_mm: "PENDIENTE: completar con ficha técnica"
        capa_desgaste_mm: "PENDIENTE: completar con ficha técnica"
        certificaciones: "PENDIENTE: completar (ej. clase de tránsito EN 685, reacción al fuego)"
        unidad_venta: "m2"
      - id: piso_vinilico_click
        nombre: "Piso vinílico click"
        usos_tipicos: ["residencial", "comercial"]
        unidad_venta: "m2"
      - id: piso_vinilico_pegado
        nombre: "Piso vinílico pegado (LVT)"
        usos_tipicos: ["comercial", "hospitalario", "educativo"]
        unidad_venta: "m2"
      - id: piso_vinilico_rollo
        nombre: "Piso vinílico en rollo (heterogéneo/homogéneo)"
        usos_tipicos: ["hospitalario", "alto tránsito", "industrial"]
        unidad_venta: "m2"
      - id: piso_laminado
        nombre: "Piso laminado / flotante"
        usos_tipicos: ["residencial", "oficinas"]
        clases_ac: ["AC3", "AC4", "AC5"]
        unidad_venta: "m2"
      - id: piso_h2o
        nombre: "Piso H2O (resistente al agua)"
        usos_tipicos: ["residencial", "comercial con humedad"]
        unidad_venta: "m2"
      - id: piso_ingenieria
        nombre: "Piso de ingeniería"
        usos_tipicos: ["residencial premium", "oficinas"]
        unidad_venta: "m2"
      - id: piso_madera
        nombre: "Piso de madera maciza"
        usos_tipicos: ["residencial premium"]
        unidad_venta: "m2"
      - id: deck_wpc
        nombre: "Deck WPC (Wood Plastic Composite)"
