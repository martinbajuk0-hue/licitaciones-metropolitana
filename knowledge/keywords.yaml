# Base de palabras clave para detección automática de licitaciones — versión
# ampliada (2026-07). Prioriza recall sobre precisión: ante la duda, se
# incluyó el término. Es normal y esperado que haya falsos positivos.
#
# ESTRUCTURA
# ──────────
# categorias.<nombre>.keywords
#   17 categorías de producto Metropolitana. Señal FUERTE: cualquier
#   coincidencia acá dispara relevancia por sí sola (config.settings.
#   todas_las_palabras_clave()).
#
# terminologia_pliegos / materiales / normativas / marcas / errores_comunes /
# abreviaturas
#   También señal FUERTE — se suman al gatillo automático. Son lo
#   suficientemente específicas del rubro construcción/pisos/superficies
#   como para no inundar de falsos positivos el monitoreo diario.
#
# lugares_uso / aplicaciones
#   Señal DÉBIL — a propósito NO se suman al gatillo automático
#   (config.settings.todas_las_palabras_clave() las excluye). Términos
#   como "escuela", "hospital", "intendencia", "interior", "alto tránsito"
#   aparecen en prácticamente cualquier licitación pública de Uruguay sin
#   importar el rubro; si dispararan solas, el monitoreo dejaría de filtrar
#   y avisaría de absolutamente todo. Se usan como CONTEXTO: sólo se
#   reportan (analyzer.identificar_contexto) cuando la licitación ya fue
#   marcada relevante por una keyword fuerte — nunca la marcan por sí solas.
#   Ver docs/ARQUITECTURA.md para el detalle de esta regla.
#
# MANTENIMIENTO
# ─────────────
# Agregar un término: sumarlo a la lista de la categoría correspondiente
# (o a terminologia_pliegos si es genérico de pliegos públicos). No hace
# falta tocar ningún .py. Evitar agregar palabras sueltas de 1-2 letras o
# palabras comunes del español/portugués (ej. "en", "de", "con") como
# abreviatura suelta: el matcher usa límite de palabra para términos
# cortos (ver config.settings.coincide_palabra_clave), pero una palabra
# de uso corriente igual generaría ruido masivo.

